services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_DB: knockout
      POSTGRES_USER: knockout
      # Local development only, bound to 127.0.0.1; set POSTGRES_PASSWORD in .env for anything else.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knockout}
    ports:
      - "127.0.0.1:${TIMESCALEDB_PORT:-5433}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/100_knockout_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knockout -d knockout"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  timescaledb-data:
